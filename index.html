  const go=()=>{const c=$('cd').value.trim();if(c.length===4)conn(()=>net({t:'join',code:c}));else $('er').textContent='Digite o código de 4 letras.'};
  $('jn').onclick=go;$('cd').onkeydown=e=>{if(e.key==='Enter')go()};fillRooms()}}
function fillRooms(){const rl=$('rl');if(!rl)return;
 rl.innerHTML=rooms.length?rooms.map(r=>'<button class="rm" data-c="'+r.code+'"><b>'+esc(r.host)+'</b><span>'+r.code+' · '+r.n+'/'+r.max+'</span></button>').join(''):'<p>Nenhuma sala pública agora. Crie uma!</p>';
 rl.querySelectorAll('.rm').forEach(b=>b.onclick=()=>conn(()=>net({t:'join',code:b.dataset.c})))}
function renderRoom(){if(!room)return;const me=room.players.find(z=>z.s===mySlot)||{},host=room.host===mySlot,ok=room.players.length>=2&&room.players.every(z=>z.s===room.host||z.ready);
 let h='<h2>Sala <span class="code">'+room.code+'</span></h2><p>'+(room.priv?'🔒 Privada':'🌐 Pública')+' · '+room.players.length+'/'+room.max+' jogadores</p><div class="pl">';
 room.players.forEach(z=>{h+='<div class="pr"><i style="background:'+PCOL[z.s]+'"></i><b>'+esc(z.name)+(z.s===mySlot?' (você)':'')+'</b><span>Rec: '+esc(z.rec)+'</span><em>'+(z.s===room.host?'👑 Anfitrião':(z.ready?'✔ Pronto':'…'))+'</em></div>'});
 h+='</div>'+(host?'<button class="gob" id="st"'+(ok?'':' disabled')+'>Iniciar partida</button>'+(ok?'':'<p>Precisa de 2+ jogadores, todos prontos.</p>'):'<button class="gob'+(me.ready?' alt':'')+'" id="rd">'+(me.ready?'Cancelar pronto':'Pronto')+'</button>')+'<button class="gob alt" id="lv">Sair da sala</button>';
 showOv(h);if(host)$('st').onclick=()=>net({t:'start'});else $('rd').onclick=()=>net({t:'ready',v:!me.ready});
 $('lv').onclick=()=>{net({t:'leave'});room=null;openMP()}}
/* cartas */
const SEV={pulo:1,lento:1,grav:2,nevoa:3,lava:2,confuso:3,suja:2,porta:2,vento:2,horda:3,furia:2,morcegos:2,tremor:1},SL=['','Leve','Média','Pesada'];
function showCards(){const r=rngf(((plan[mapN]||{}).s||1)+4242);let a=CURSES.filter(c=>tier(c.id)<3);if(a.length<3)a=CURSES.slice();
 for(let i=a.length-1;i>0;i--){const j=fl(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 const pool=a.slice(0,3);picks={};cardDone=false;voted=null;
 const act=CURSES.filter(c=>tier(c.id)).map(c=>'<span class="chip" style="--c:'+c.c+'">'+c.s+' '+c.n+' '+ROM[tier(c.id)]+'</span>').join('');
 let h='<h2>Mapa '+(mapN+1)+' concluído ✔</h2><p>Escolha uma maldição para o próximo mapa. Repetir a mesma a evolui (até III).'+(mp?' A mais votada vence (15s).':'')+'</p>'+(act?'<div class="chips">'+act+'</div>':'')+'<div class="cards">';
 pool.forEach((c,i)=>{const t=tier(c.id),nx=Math.min(3,t+1);let pips='';for(let k=1;k<=3;k++)pips+='<i class="'+(k<=t?'on':(k===nx?'nx':''))+'"></i>';
  h+='<button class="card" data-id="'+c.id+'" style="--c:'+c.c+';--d:'+i*.12+'s"><kbd>'+(i+1)+'</kbd><div class="sym">'+c.s+'</div><h3>'+c.n+'</h3><span class="sev s'+SEV[c.id]+'">'+SL[SEV[c.id]]+'</span><div class="pips">'+pips+'</div><div class="d">'+c.d(nx)+'</div><small>'+(t?'Evolui: '+ROM[t]+' → '+ROM[nx]:'Nova maldição: nível I')+'</small></button>'});
 showOv(h+'</div><p id="vt"></p>');
 ovEl.querySelectorAll('.card').forEach(b=>b.onclick=()=>pickCard(b.getAttribute('data-id')));
 clearTimeout(cardTO);if(mp&&room&&room.host===mySlot)cardTO=setTimeout(resolveCards,15000)}
function pickCard(id){if(voted)return;voted=id;if(!mp){applyCard(id);return}picks[mySlot]=id;net({t:'pick',id});
 ovEl.querySelectorAll('.card').forEach(b=>{b.style.opacity=b.dataset.id===id?1:.35;b.style.pointerEvents='none'});cardVotes();hostCheck()}
function cardVotes(){const v=$('vt');if(v&&room)v.textContent='Votos: '+Object.keys(picks).length+'/'+room.players.length+(voted?' — aguardando os outros':'')}
function hostCheck(){if(room&&room.host===mySlot&&Object.keys(picks).length>=room.players.length)resolveCards()}
function resolveCards(){if(cardDone||!mp||!room||room.host!==mySlot||!$('vt'))return;cardDone=true;clearTimeout(cardTO);
 const t={};Object.values(picks).forEach(i=>t[i]=(t[i]||0)+1);let ids=Object.keys(t);if(!ids.length)ids=[...ovEl.querySelectorAll('.card')].map(b=>b.dataset.id);
 const mx=Math.max(...ids.map(i=>t[i]||0)),top=ids.filter(i=>(t[i]||0)===mx),id=top[fl(Math.random()*top.length)];net({t:'cardres',id});applyCard(id)}
function applyCard(id){curses[id]=Math.min(3,tier(id)+1);recSave(mapN+2);hideOv();loadMap(mapN+1)}
function showWin(){recSave(MAPS,true);showOv('<h2>'+(mp?'Vocês zeraram':'Você zerou')+' os '+MAPS+' mapas! 🎉</h2><p>Mortes no total: '+deaths+'.</p><button class="gob" id="again">'+(mp?'Voltar à sala':'Jogar de novo')+'</button>');
 $('again').onclick=()=>{if(mp){net({t:'prof',name:myName,rec:recTxt(rec)});net({t:'back'})}else{hideOv();curses={};plan=[];loadMap(0)}}}
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||ovEl.hidden||!/^Digit[1-3]$/.test(e.code))return;const c=ovEl.querySelectorAll('.card')[+e.code[5]-1];if(c)c.click()});
$('xb').onclick=()=>{if(confirm('Sair da sala?'))showStart()};
loadMap(0);showStart();requestAnimationFrame(loop);
</script></body></html>
